<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lossy — shot boundary verification</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font-family: monospace; font-size: 13px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr;
    height: 100vh;
    gap: 0;
  }

  /* Video area */
  .video-area {
    grid-column: 1;
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    background: #000;
    min-height: 0;
  }
  video {
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: contain;
    background: #000;
  }

  /* Timeline */
  .timeline-container {
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 1px solid #333;
  }
  .timeline {
    position: relative;
    height: 32px;
    background: #222;
    border-radius: 3px;
    cursor: pointer;
    overflow: hidden;
  }
  .timeline-shot {
    position: absolute;
    top: 0;
    height: 100%;
    border-right: 1px solid rgba(255, 180, 0, 0.6);
    transition: background 0.1s;
  }
  .timeline-shot:hover { background: rgba(255, 180, 0, 0.15); }
  .timeline-shot.active { background: rgba(255, 180, 0, 0.25); }
  .timeline-playhead {
    position: absolute;
    top: 0;
    width: 2px;
    height: 100%;
    background: #fff;
    pointer-events: none;
    z-index: 10;
  }
  .time-label {
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888;
  }

  /* Controls bar */
  .controls {
    padding: 8px 12px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid #333;
  }
  .controls button {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: monospace;
    font-size: 12px;
  }
  .controls button:hover { background: #444; }
  .controls button:active { background: #555; }
  .controls .spacer { flex: 1; }
  .shot-info-bar { color: #fb0; }

  /* Shot list sidebar */
  .sidebar {
    grid-column: 2;
    grid-row: 1 / 3;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-header {
    padding: 10px 12px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-size: 14px;
    font-weight: bold;
    color: #fb0;
    display: flex;
    justify-content: space-between;
  }
  .shot-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .shot-item {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    align-items: center;
  }
  .shot-item:hover { background: #1a1a1a; }
  .shot-item.active { background: #2a2200; border-left: 3px solid #fb0; }
  .shot-item img {
    width: 80px;
    height: 34px;
    object-fit: cover;
    border-radius: 2px;
    background: #222;
  }
  .shot-meta { font-size: 11px; line-height: 1.4; }
  .shot-meta .shot-num { color: #fb0; }
  .shot-meta .shot-time { color: #888; }
  .shot-meta .shot-dur { color: #aaa; }

  /* Keyboard help */
  .help {
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 1px solid #333;
    font-size: 10px;
    color: #666;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="video-area">
    <video id="video" preload="auto">
      <source src="/media/star_wars_iv.mp4" type="video/mp4">
    </video>
    <div class="controls">
      <button id="btn-prev">← Prev</button>
      <button id="btn-play">Play</button>
      <button id="btn-next">Next →</button>
      <button id="btn-boundary">▶ Play to boundary</button>
      <span class="spacer"></span>
      <span class="shot-info-bar" id="shot-info">Loading...</span>
    </div>
    <div class="timeline-container">
      <div class="timeline" id="timeline">
        <div class="timeline-playhead" id="playhead"></div>
      </div>
      <div class="time-label">
        <span id="time-current">00:00:00</span>
        <span id="time-total">--:--:--</span>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span>Shots</span>
      <span id="shot-count">—</span>
    </div>
    <div class="shot-list" id="shot-list"></div>
    <div class="help">
      <b>Keys:</b> Space=play/pause, ←/→=prev/next shot, [/]=step ±1s, B=play to boundary
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const timeline = document.getElementById('timeline');
const playhead = document.getElementById('playhead');
const shotList = document.getElementById('shot-list');
const shotInfo = document.getElementById('shot-info');
const shotCount = document.getElementById('shot-count');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const btnPlay = document.getElementById('btn-play');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnBoundary = document.getElementById('btn-boundary');

let scenes = [];
let activeShot = -1;
let boundaryTarget = null;

function fmt(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function findShot(time) {
  // binary search
  let lo = 0, hi = scenes.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (time < scenes[mid].start_s) hi = mid - 1;
    else if (time >= scenes[mid].end_s) lo = mid + 1;
    else return mid;
  }
  return Math.max(0, Math.min(lo, scenes.length - 1));
}

function setActiveShot(idx) {
  if (idx === activeShot) return;
  const prev = document.querySelector('.shot-item.active');
  if (prev) prev.classList.remove('active');
  const prevTl = document.querySelector('.timeline-shot.active');
  if (prevTl) prevTl.classList.remove('active');

  activeShot = idx;
  const el = document.getElementById(`shot-${idx}`);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({ block: 'nearest' });
  }
  const tlEl = document.getElementById(`tl-${idx}`);
  if (tlEl) tlEl.classList.add('active');

  const s = scenes[idx];
  shotInfo.textContent = `Shot ${idx + 1}/${scenes.length}  |  ${s.start_timecode} → ${s.end_timecode}  |  ${s.duration_s.toFixed(2)}s`;
}

function jumpToShot(idx) {
  if (idx < 0 || idx >= scenes.length) return;
  video.currentTime = scenes[idx].start_s;
  setActiveShot(idx);
}

function playToBoundary() {
  if (activeShot < 0 || activeShot >= scenes.length) return;
  const boundary = scenes[activeShot].end_s;
  // Start 2s before boundary (or from shot start if shot is short)
  const startFrom = Math.max(scenes[activeShot].start_s, boundary - 2);
  video.currentTime = startFrom;
  boundaryTarget = boundary + 0.5; // play 0.5s past
  video.play();
}

// Load shot index
fetch('/shot_index.json')
  .then(r => r.json())
  .then(data => {
    scenes = data.scenes;
    shotCount.textContent = scenes.length;
    const duration = scenes[scenes.length - 1].end_s;

    // Build timeline markers
    scenes.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'timeline-shot';
      el.id = `tl-${i}`;
      el.style.left = `${(s.start_s / duration) * 100}%`;
      el.style.width = `${((s.end_s - s.start_s) / duration) * 100}%`;
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        jumpToShot(i);
      });
      timeline.appendChild(el);
    });

    // Build shot list
    scenes.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'shot-item';
      el.id = `shot-${i}`;
      el.innerHTML = `
        <img src="/keyframes/${s.keyframe}" loading="lazy" alt="Shot ${i+1}">
        <div class="shot-meta">
          <div><span class="shot-num">#${i+1}</span> <span class="shot-dur">${s.duration_s.toFixed(2)}s</span></div>
          <div class="shot-time">${s.start_timecode} → ${s.end_timecode}</div>
        </div>
      `;
      el.addEventListener('click', () => jumpToShot(i));
      shotList.appendChild(el);
    });

    setActiveShot(0);
  });

// Video time updates
video.addEventListener('timeupdate', () => {
  const t = video.currentTime;
  const dur = video.duration || 1;
  playhead.style.left = `${(t / dur) * 100}%`;
  timeCurrent.textContent = fmt(t);

  const idx = findShot(t);
  setActiveShot(idx);

  // Stop at boundary if playing to boundary
  if (boundaryTarget !== null && t >= boundaryTarget) {
    video.pause();
    boundaryTarget = null;
  }
});

video.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmt(video.duration);
});

// Timeline click to seek
timeline.addEventListener('click', (e) => {
  const rect = timeline.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  video.currentTime = pct * video.duration;
});

// Controls
btnPlay.addEventListener('click', () => {
  if (video.paused) { video.play(); btnPlay.textContent = 'Pause'; }
  else { video.pause(); btnPlay.textContent = 'Play'; }
});
video.addEventListener('play', () => btnPlay.textContent = 'Pause');
video.addEventListener('pause', () => btnPlay.textContent = 'Play');
btnPrev.addEventListener('click', () => jumpToShot(activeShot - 1));
btnNext.addEventListener('click', () => jumpToShot(activeShot + 1));
btnBoundary.addEventListener('click', playToBoundary);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ':
      e.preventDefault();
      if (video.paused) video.play(); else video.pause();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      jumpToShot(activeShot - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      jumpToShot(activeShot + 1);
      break;
    case '[':
      video.currentTime = Math.max(0, video.currentTime - 1);
      break;
    case ']':
      video.currentTime += 1;
      break;
    case 'b':
    case 'B':
      playToBoundary();
      break;
  }
});
</script>
</body>
</html>
