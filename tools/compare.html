<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lossy — original vs reconstructed</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font-family: monospace; font-size: 13px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 1fr auto auto;
    height: 100vh;
    gap: 0;
  }

  /* Dual video area */
  .video-area {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    min-height: 0;
  }
  .video-pair {
    flex: 1;
    display: flex;
    gap: 2px;
    min-height: 0;
    background: #000;
  }
  .video-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    position: relative;
  }
  .video-pane video {
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: contain;
    background: #000;
    cursor: pointer;
  }
  .pane-label {
    position: absolute;
    top: 8px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 11px;
    z-index: 5;
    pointer-events: none;
  }
  .pane-label.original { color: #4af; }
  .pane-label.reconstructed { color: #f84; }
  .divider {
    width: 2px;
    background: #333;
    align-self: stretch;
    flex-shrink: 0;
  }

  /* Controls bar */
  .controls {
    grid-column: 1;
    grid-row: 2;
    padding: 8px 12px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid #333;
  }
  .controls button {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: monospace;
    font-size: 12px;
  }
  .controls button:hover { background: #444; }
  .controls button:active { background: #555; }
  .controls button.active { background: #553300; border-color: #fb0; color: #fb0; }
  .controls .spacer { flex: 1; }
  .shot-info-bar { color: #fb0; }
  .sync-indicator { color: #888; font-size: 11px; }
  .sync-indicator.warn { color: #f44; }

  /* Timeline */
  .timeline-container {
    grid-column: 1;
    grid-row: 3;
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 1px solid #333;
  }
  .timeline {
    position: relative;
    height: 32px;
    background: #222;
    border-radius: 3px;
    cursor: pointer;
    overflow: hidden;
  }
  .timeline-shot {
    position: absolute;
    top: 0;
    height: 100%;
    border-right: 1px solid rgba(255, 180, 0, 0.6);
    transition: background 0.1s;
  }
  .timeline-shot:hover { background: rgba(255, 180, 0, 0.15); }
  .timeline-shot.active { background: rgba(255, 180, 0, 0.25); }
  .timeline-shot.not-decoded { opacity: 0.25; }
  .timeline-playhead {
    position: absolute;
    top: 0;
    width: 2px;
    height: 100%;
    background: #fff;
    pointer-events: none;
    z-index: 10;
  }
  .time-label {
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888;
  }

  /* Sidebar */
  .sidebar {
    grid-column: 2;
    grid-row: 1 / 4;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-header {
    padding: 10px 12px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-size: 14px;
    font-weight: bold;
    color: #fb0;
    display: flex;
    justify-content: space-between;
  }

  /* View mode tabs */
  .view-tabs {
    display: flex;
    border-bottom: 1px solid #333;
    background: #1a1a1a;
  }
  .view-tab {
    flex: 1;
    padding: 6px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 11px;
    color: #888;
    border-bottom: 2px solid transparent;
  }
  .view-tab:hover { color: #ddd; }
  .view-tab.active { color: #fb0; border-bottom-color: #fb0; }

  .shot-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .shot-item {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 8px;
    padding: 5px 8px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    align-items: center;
  }
  .shot-item.two-col {
    grid-template-columns: 80px 1fr;
  }
  .shot-item:hover { background: #1a1a1a; }
  .shot-item.active { background: #2a2200; border-left: 3px solid #fb0; }
  .shot-item.not-decoded { opacity: 0.4; }
  .shot-item img {
    width: 100%;
    height: 26px;
    object-fit: cover;
    border-radius: 2px;
    background: #222;
  }
  .shot-item img.placeholder {
    background: #2a1a00;
    border: 1px dashed #553300;
  }
  .shot-meta { font-size: 10px; line-height: 1.4; }
  .shot-meta .shot-num { color: #fb0; }
  .shot-meta .shot-time { color: #888; }
  .shot-meta .shot-dur { color: #aaa; }

  /* Prompt panel */
  .prompt-panel {
    border-top: 1px solid #333;
    background: #1a1a1a;
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.5;
    color: #aaa;
    display: none;
  }
  .prompt-panel.visible { display: block; }
  .prompt-panel .prompt-label { color: #fb0; font-weight: bold; margin-bottom: 4px; }
  .prompt-panel .prompt-text { color: #ddd; }

  .help {
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 1px solid #333;
    font-size: 10px;
    color: #666;
    line-height: 1.6;
  }

  /* Setup overlay */
  .setup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .setup-overlay.hidden { display: none; }
  .setup-box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 32px;
    max-width: 560px;
    width: 100%;
  }
  .setup-box h2 { color: #fb0; margin-bottom: 16px; }
  .setup-box p { margin-bottom: 12px; line-height: 1.5; color: #aaa; }
  .setup-box code {
    background: #222;
    padding: 2px 6px;
    border-radius: 3px;
    color: #ddd;
  }
  .setup-box .field { margin-bottom: 16px; }
  .setup-box label { display: block; margin-bottom: 4px; color: #888; font-size: 12px; }
  .setup-box select, .setup-box input {
    width: 100%;
    background: #222;
    border: 1px solid #444;
    color: #ddd;
    padding: 8px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 13px;
    appearance: auto;
  }
  .setup-box select option { background: #222; color: #ddd; }
  .setup-box button {
    background: #fb0;
    color: #111;
    border: none;
    padding: 8px 24px;
    border-radius: 3px;
    cursor: pointer;
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
  }
  .setup-box button:hover { background: #fc3; }
  .setup-box button:disabled { background: #555; color: #888; cursor: default; }
  .setup-box .error { color: #f44; font-size: 12px; margin-top: 8px; display: none; }
  .setup-box .hint { color: #666; font-size: 11px; margin-top: 4px; }
  .setup-box .no-recon { color: #f84; font-size: 11px; }
</style>
</head>
<body>

<!-- Setup overlay -->
<div class="setup-overlay" id="setup-overlay">
  <div class="setup-box">
    <h2>lossy comparator</h2>
    <p>Start with: <code>python tools/serve.py</code></p>
    <div class="field">
      <label>Source film</label>
      <select id="input-source" disabled>
        <option value="">Scanning...</option>
      </select>
    </div>
    <button id="btn-start" disabled>Start</button>
    <div class="error" id="setup-error"></div>
  </div>
</div>

<div class="layout">
  <div class="video-area">
    <div class="video-pair">
      <div class="video-pane">
        <span class="pane-label original">ORIGINAL</span>
        <video id="vid-original" preload="metadata" muted></video>
      </div>
      <div class="divider"></div>
      <div class="video-pane">
        <span class="pane-label reconstructed">RECONSTRUCTED</span>
        <video id="vid-reconstructed" preload="metadata"></video>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-prev" title="Previous shot">&#8592; Prev</button>
    <button id="btn-play" title="Play/pause both">Play</button>
    <button id="btn-next" title="Next shot">Next &#8594;</button>
    <button id="btn-solo" title="Toggle single-shot loop">Loop shot</button>
    <button id="btn-audio" title="Cycle audio source (M)">Audio: generated</button>
    <audio id="speech-audio" preload="auto"></audio>
    <input id="volume-slider" type="range" min="0" max="100" value="70" title="Volume" style="width:60px;vertical-align:middle;accent-color:#fb0;cursor:pointer">
    <span class="spacer"></span>
    <select id="strategy-select" style="background:#333;color:#ddd;border:1px solid #555;padding:3px 6px;border-radius:3px;font-family:monospace;font-size:12px;display:none"></select>
    <label style="font-size:11px;color:#888;cursor:pointer;margin-left:8px" title="Serve videos directly from disk (avoids HTTP buffering issues with large files)"><input type="checkbox" id="use-file-urls" style="vertical-align:middle;accent-color:#fb0;cursor:pointer"> file://</label>
    <span class="sync-indicator" id="sync-info"></span>
    <span class="shot-info-bar" id="shot-info">Loading...</span>
  </div>

  <div class="timeline-container">
    <div class="timeline" id="timeline">
      <div class="timeline-playhead" id="playhead"></div>
    </div>
    <div class="time-label">
      <span id="time-current">00:00:00</span>
      <span id="time-total">--:--:--</span>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span>Shots</span>
      <span id="shot-count">&mdash;</span>
    </div>
    <div class="view-tabs">
      <div class="view-tab active" data-view="paired">Paired</div>
      <div class="view-tab" data-view="prompt">With prompt</div>
    </div>
    <div class="shot-list" id="shot-list"></div>
    <div class="prompt-panel" id="prompt-panel">
      <div class="prompt-label">Prompt</div>
      <div class="prompt-text" id="prompt-text"></div>
    </div>
    <div class="help">
      <b>Keys:</b> Space=play/pause, &#8592;/&#8594;=prev/next shot,
      [/]=step &plusmn;1s, L=loop shot, M=cycle audio source
    </div>
  </div>
</div>

<script>
const vidOrig = document.getElementById('vid-original');
const vidRecon = document.getElementById('vid-reconstructed');
const timeline = document.getElementById('timeline');
const playhead = document.getElementById('playhead');
const shotList = document.getElementById('shot-list');
const shotInfo = document.getElementById('shot-info');
const shotCount = document.getElementById('shot-count');
const syncInfo = document.getElementById('sync-info');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const btnPlay = document.getElementById('btn-play');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnSolo = document.getElementById('btn-solo');
const promptPanel = document.getElementById('prompt-panel');
const promptText = document.getElementById('prompt-text');
const setupOverlay = document.getElementById('setup-overlay');
const setupError = document.getElementById('setup-error');
const strategySelect = document.getElementById('strategy-select');

let scenes = [];
let prompts = [];
let activeShot = -1;
let loopShot = false;
let viewMode = 'paired';

// Audio source: 'generated', 'generated+speech', 'original', 'off'
let audioSource = 'generated';
let hasSpeech = false;
const btnAudio = document.getElementById('btn-audio');
const speechAudio = document.getElementById('speech-audio');

function setAudioSource(src) {
  audioSource = src;
  if (src === 'generated') {
    vidOrig.muted = true;
    vidRecon.muted = false;
    speechAudio.muted = true;
    btnAudio.textContent = 'Audio: generated';
    btnAudio.classList.remove('active');
  } else if (src === 'generated+speech') {
    vidOrig.muted = true;
    vidRecon.muted = false;
    speechAudio.muted = false;
    btnAudio.textContent = 'Audio: gen+speech';
    btnAudio.classList.add('active');
  } else if (src === 'original') {
    vidOrig.muted = false;
    vidRecon.muted = true;
    speechAudio.muted = true;
    btnAudio.textContent = 'Audio: original';
    btnAudio.classList.add('active');
  } else {
    vidOrig.muted = true;
    vidRecon.muted = true;
    speechAudio.muted = true;
    btnAudio.textContent = 'Audio: off';
    btnAudio.classList.remove('active');
  }
}

function cycleAudioSource() {
  if (audioSource === 'generated') {
    if (hasSpeech) setAudioSource('generated+speech');
    else setAudioSource('original');
  } else if (audioSource === 'generated+speech') setAudioSource('original');
  else if (audioSource === 'original') setAudioSource('off');
  else setAudioSource('generated');
}

// Volume
const volumeSlider = document.getElementById('volume-slider');
vidOrig.volume = vidRecon.volume = speechAudio.volume = 0.7;
volumeSlider.addEventListener('input', () => {
  const v = volumeSlider.value / 100;
  vidOrig.volume = vidRecon.volume = speechAudio.volume = v;
});

// Clip-based playback: each decoded shot maps to individual clip file(s)
// instead of seeking within one large concatenated video.
let clipMap = {};        // shot index -> { clips: [{src, duration}], totalDuration }
let decodedShots = new Set();
let clipsBasePath = '';  // e.g. "/output/star_wars_iv_v2/adjusted/runpod-wan"
let currentClipShotIdx = -1;  // which shot's clip is loaded in vidRecon
let currentSubClipIdx = 0;    // for split shots: which sub-clip is active
let isSeeking = false;
let lastSyncedShot = -1;
let pendingLoad = null;  // debounce: cancel stale clip loads

// -- Formatting --
function fmt(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// -- Shot lookup (in original video time) --
function findShot(time) {
  let lo = 0, hi = scenes.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (time < scenes[mid].start_s) hi = mid - 1;
    else if (time >= scenes[mid].end_s) lo = mid + 1;
    else return mid;
  }
  return Math.max(0, Math.min(lo, scenes.length - 1));
}

// -- Build clip map from decode progress --
function buildClipMap(progress, basePath) {
  clipMap = {};
  decodedShots = new Set();
  clipsBasePath = basePath;

  if (!progress) return;

  // Use clips metadata if available (has per-shot filenames)
  const clipsMeta = progress.clips || {};
  const completed = progress.completed || [];

  for (const idx of completed) {
    const idxStr = String(idx);
    if (clipsMeta[idxStr]) {
      // Has detailed clip info — use filenames from progress
      const clips = clipsMeta[idxStr].map(c => ({
        src: `${basePath}/${c.path}`,
        duration: c.duration_s
      }));
      clipMap[idx] = {
        clips,
        totalDuration: clips.reduce((sum, c) => sum + c.duration, 0)
      };
    } else {
      // Fallback: assume single clip named {NNNN}.mp4
      const dur = scenes[idx] ? scenes[idx].duration_s : 5;
      clipMap[idx] = {
        clips: [{ src: `${basePath}/${String(idx).padStart(4, '0')}.mp4`, duration: dur }],
        totalDuration: dur
      };
    }
    decodedShots.add(idx);
  }
}

// For split shots: find which sub-clip and position within it
function resolveSubClip(mapping, offsetInShot) {
  let cumulative = 0;
  for (let i = 0; i < mapping.clips.length; i++) {
    const clipDur = mapping.clips[i].duration;
    if (offsetInShot < cumulative + clipDur || i === mapping.clips.length - 1) {
      return { subIdx: i, posInClip: Math.max(0, offsetInShot - cumulative) };
    }
    cumulative += clipDur;
  }
  return { subIdx: 0, posInClip: 0 };
}

// -- Clip loading --
let clipErrorHandler = null;

function safePlay(el) {
  const p = el.play();
  if (p && p.catch) p.catch(() => {}); // swallow autoplay rejections
}

function loadClip(shotIdx, subIdx, seekTo) {
  const mapping = clipMap[shotIdx];
  if (!mapping) return;
  const clip = mapping.clips[subIdx];

  let src = clip.src;
  if (useFileUrls.checked && projectRoot) {
    src = toFileUrl(src);
  }

  // Already loaded — just seek within it
  if (currentClipShotIdx === shotIdx && currentSubClipIdx === subIdx && vidRecon.readyState >= 2) {
    vidRecon.currentTime = Math.max(0, seekTo);
    if (!vidOrig.paused && vidRecon.paused) safePlay(vidRecon);
    return;
  }

  currentClipShotIdx = shotIdx;
  currentSubClipIdx = subIdx;

  // Cancel any pending load
  if (pendingLoad) {
    vidRecon.removeEventListener('canplay', pendingLoad);
    pendingLoad = null;
  }
  if (clipErrorHandler) {
    vidRecon.removeEventListener('error', clipErrorHandler);
    clipErrorHandler = null;
  }

  vidRecon.src = src;

  pendingLoad = function onReady() {
    vidRecon.removeEventListener('canplay', onReady);
    vidRecon.removeEventListener('error', clipErrorHandler);
    pendingLoad = null;
    clipErrorHandler = null;
    vidRecon.currentTime = Math.max(0, seekTo);
    if (!vidOrig.paused) safePlay(vidRecon);
  };

  clipErrorHandler = function onError() {
    vidRecon.removeEventListener('canplay', pendingLoad);
    vidRecon.removeEventListener('error', onError);
    pendingLoad = null;
    clipErrorHandler = null;
    console.warn(`[lossy] failed to load clip: ${src}`);
    syncInfo.textContent = 'clip error';
    syncInfo.className = 'sync-indicator warn';
  };

  vidRecon.addEventListener('canplay', pendingLoad);
  vidRecon.addEventListener('error', clipErrorHandler);
  vidRecon.load();
}

// -- Sync engine --
// Original is the leader. For each decoded shot, the corresponding individual
// clip file is loaded into vidRecon. For split shots (multiple sub-clips per shot),
// sub-clip advancement is handled by the 'ended' event — the sync engine only
// swaps clips on shot boundaries.
function syncReconToOrig() {
  if (isSeeking) return;
  const t = vidOrig.currentTime;
  const idx = findShot(t);
  const mapping = clipMap[idx];

  if (!mapping) {
    // Not decoded — pause recon
    if (!vidRecon.paused) vidRecon.pause();
    syncInfo.textContent = 'not decoded';
    syncInfo.className = 'sync-indicator warn';
    lastSyncedShot = idx;
    return;
  }

  // Shot changed — load first sub-clip of new shot
  if (idx !== currentClipShotIdx) {
    const offsetInShot = t - scenes[idx].start_s;
    const { subIdx, posInClip } = resolveSubClip(mapping, offsetInShot);
    loadClip(idx, subIdx, posInClip);
    lastSyncedShot = idx;
    syncInfo.textContent = '';
    syncInfo.className = 'sync-indicator';
    return;
  }

  // Same shot — ensure recon is playing.
  // Sub-clip transitions within the shot are driven by the 'ended' event.
  if (vidRecon.readyState >= 2) {
    if (!vidOrig.paused && vidRecon.paused) {
      if (vidRecon.ended) {
        // Clip finished — seek back to start so it can play again if needed
        vidRecon.currentTime = 0;
      }
      safePlay(vidRecon);
    }

    syncInfo.textContent = '';
    syncInfo.className = 'sync-indicator';
  }

  lastSyncedShot = idx;
}

// Handle split shots: when a sub-clip ends, advance to next sub-clip
vidRecon.addEventListener('ended', () => {
  if (currentClipShotIdx < 0) return;
  const mapping = clipMap[currentClipShotIdx];
  if (!mapping) return;
  if (currentSubClipIdx + 1 < mapping.clips.length) {
    loadClip(currentClipShotIdx, currentSubClipIdx + 1, 0);
  }
  // Otherwise sync engine handles shot transition on next timeupdate
});

function seekBoth(origTime, shotIdx) {
  isSeeking = true;
  vidOrig.currentTime = origTime;
  if (hasSpeech) speechAudio.currentTime = origTime;
  const idx = shotIdx !== undefined ? shotIdx : findShot(origTime);
  const mapping = clipMap[idx];
  if (mapping) {
    const offsetInShot = origTime - scenes[idx].start_s;
    const { subIdx, posInClip } = resolveSubClip(mapping, offsetInShot);
    loadClip(idx, subIdx, Math.max(0, posInClip));
  }
  lastSyncedShot = idx;
  setTimeout(() => { isSeeking = false; }, 250);
}

function playBoth() {
  safePlay(vidOrig);
  const mapping = clipMap[findShot(vidOrig.currentTime)];
  if (mapping && vidRecon.readyState >= 2) safePlay(vidRecon);
  if (hasSpeech) safePlay(speechAudio);
  btnPlay.textContent = 'Pause';
}

function pauseBoth() {
  vidOrig.pause();
  vidRecon.pause();
  if (hasSpeech) speechAudio.pause();
  btnPlay.textContent = 'Play';
}

function togglePlay() {
  if (vidOrig.paused) playBoth();
  else pauseBoth();
}

// -- Active shot management --
function setActiveShot(idx) {
  if (idx === activeShot) return;
  const prev = document.querySelector('.shot-item.active');
  if (prev) prev.classList.remove('active');
  const prevTl = document.querySelector('.timeline-shot.active');
  if (prevTl) prevTl.classList.remove('active');

  activeShot = idx;
  const el = document.getElementById(`shot-${idx}`);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({ block: 'nearest' });
  }
  const tlEl = document.getElementById(`tl-${idx}`);
  if (tlEl) tlEl.classList.add('active');

  const s = scenes[idx];
  const decoded = decodedShots.has(idx);
  const tag = decoded ? '' : '  [not decoded]';
  shotInfo.textContent = `Shot ${idx + 1}/${scenes.length}  |  ${s.start_timecode} \u2192 ${s.end_timecode}  |  ${s.duration_s.toFixed(2)}s${tag}`;

  // Update prompt panel
  if (prompts.length > idx) {
    const p = prompts[idx];
    promptText.textContent = p.formatted_prompt || p.prompt || '(no prompt)';
  } else {
    promptText.textContent = '(no prompt data)';
  }

}

function jumpToShot(idx) {
  if (idx < 0 || idx >= scenes.length) return;
  seekBoth(scenes[idx].start_s, idx);
  setActiveShot(idx);
}

// -- Shot looping --
function checkShotLoop() {
  if (!loopShot || activeShot < 0) return;
  const s = scenes[activeShot];
  if (vidOrig.currentTime >= s.end_s) {
    seekBoth(s.start_s, activeShot);
  }
}

// -- Build UI --
function buildTimeline() {
  const duration = scenes[scenes.length - 1].end_s;
  scenes.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'timeline-shot';
    if (!decodedShots.has(i)) el.classList.add('not-decoded');
    el.id = `tl-${i}`;
    el.style.left = `${(s.start_s / duration) * 100}%`;
    el.style.width = `${((s.end_s - s.start_s) / duration) * 100}%`;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      jumpToShot(i);
    });
    timeline.appendChild(el);
  });
}

function buildShotList() {
  shotList.innerHTML = '';
  scenes.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = viewMode === 'prompt' ? 'shot-item two-col' : 'shot-item';
    if (!decodedShots.has(i)) el.classList.add('not-decoded');
    el.id = `shot-${i}`;

    if (viewMode === 'paired') {
      el.innerHTML = `
        <img src="${outputBase}/keyframes/${s.keyframes[0]}" loading="lazy" alt="Shot ${i+1}">
        <div class="shot-meta">
          <div><span class="shot-num">#${i+1}</span> <span class="shot-dur">${s.duration_s.toFixed(1)}s</span></div>
          <div class="shot-time">${s.start_timecode}</div>
        </div>
      `;
    } else {
      const promptExcerpt = prompts[i]
        ? (prompts[i].formatted_prompt || prompts[i].prompt || '').slice(0, 80) + '...'
        : '';
      el.innerHTML = `
        <img src="${outputBase}/keyframes/${s.keyframes[0]}" loading="lazy" alt="Shot ${i+1}">
        <div class="shot-meta">
          <div><span class="shot-num">#${i+1}</span> <span class="shot-dur">${s.duration_s.toFixed(1)}s</span></div>
          <div class="shot-time" style="color:#aaa">${promptExcerpt}</div>
        </div>
      `;
    }
    el.addEventListener('click', () => jumpToShot(i));
    shotList.appendChild(el);
  });
}

let outputBase = ''; // e.g. "/output/star_wars_iv_v2"
let currentOrigSrc = ''; // HTTP path to original video (preserved for re-init)

// Convert a server-relative path (e.g. "/media/foo.mp4") to a file:// URL
function toFileUrl(httpPath) {
  // Strip leading slash, join with project root
  const rel = httpPath.replace(/^\//, '');
  return 'file://' + projectRoot + '/' + rel;
}

// -- Initialization --
function init(originalSrc, reconSrc, base) {
  outputBase = base;
  currentOrigSrc = originalSrc;
  if (useFileUrls.checked && projectRoot) {
    vidOrig.src = toFileUrl(originalSrc);
  } else {
    vidOrig.src = originalSrc;
  }
  // Reset clip state — vidRecon.src is set per-clip by loadClip()
  currentClipShotIdx = -1;
  currentSubClipIdx = 0;
  lastSyncedShot = -1;

  // Determine strategy name for per-strategy progress + clips path
  const strategyOpt = strategySelect.selectedOptions[0];
  const strategyName = strategyOpt ? strategyOpt.dataset.strategyName : null;
  // Video strategy name (before +audio suffix) for clips directory
  const videoStrategy = strategyName && strategyName.includes('+')
    ? strategyName.split('+')[0]
    : strategyName;

  // Try per-strategy progress first, fall back to legacy
  const progressUrls = [];
  if (strategyName && strategyName !== 'default') {
    progressUrls.push(`${base}/decode_progress_${strategyName}.json`);
    if (strategyName.includes('+')) {
      progressUrls.push(`${base}/decode_progress_${videoStrategy}.json`);
    }
  }
  progressUrls.push(`${base}/decode_progress.json`);

  const fetchProgress = async () => {
    for (const url of progressUrls) {
      try {
        const r = await fetch(url);
        if (r.ok) return await r.json();
      } catch {}
    }
    return null;
  };

  // Check for speech track
  fetch(`${base}/speech_track.wav`, {method: 'HEAD'}).then(r => {
    if (r.ok) {
      hasSpeech = true;
      speechAudio.src = `${base}/speech_track.wav`;
      speechAudio.muted = true;
    } else {
      hasSpeech = false;
      speechAudio.src = '';
    }
  }).catch(() => { hasSpeech = false; });

  // Load manifest, prompts, and decode progress
  Promise.all([
    fetch(`${base}/manifest.json`).then(r => r.json()),
    fetch(`${base}/prompts.json`).then(r => r.json()).catch(() => []),
    fetchProgress()
  ]).then(([manifest, promptData, progress]) => {
    scenes = manifest.scenes;
    prompts = promptData;

    // Build clip map — clips live in adjusted/{videoStrategy}/
    const adjBase = `${base}/adjusted/${videoStrategy}`;
    buildClipMap(progress, adjBase);

    const decodedCount = decodedShots.size;
    shotCount.textContent = `${decodedCount}/${scenes.length}`;

    buildTimeline();
    buildShotList();

    // Start on the first decoded shot if possible
    const sorted = [...decodedShots].sort((a, b) => a - b);
    const firstDecoded = sorted[0] || 0;
    setActiveShot(firstDecoded);
    seekBoth(scenes[firstDecoded].start_s, firstDecoded);
  });

  // Time updates from original (leader)
  vidOrig.addEventListener('timeupdate', () => {
    const t = vidOrig.currentTime;
    const dur = vidOrig.duration || 1;
    playhead.style.left = `${(t / dur) * 100}%`;
    timeCurrent.textContent = fmt(t);

    const idx = findShot(t);
    setActiveShot(idx);

    syncReconToOrig();
    checkShotLoop();
  });

  vidOrig.addEventListener('loadedmetadata', () => {
    timeTotal.textContent = fmt(vidOrig.duration);
  });

  vidOrig.addEventListener('play', () => btnPlay.textContent = 'Pause');
  vidOrig.addEventListener('pause', () => btnPlay.textContent = 'Play');
}

// -- Scan API + setup form --
const selectSource = document.getElementById('input-source');
const useFileUrls = document.getElementById('use-file-urls');
let scanData = null;
let projectRoot = ''; // absolute path from server, for file:// URLs
let currentStrategies = []; // strategies for current source

fetch('/api/scan')
  .then(r => r.json())
  .then(data => {
    scanData = data;
    projectRoot = data.project_root || '';

    selectSource.innerHTML = '';
    if (data.sources.length === 0) {
      selectSource.innerHTML = '<option value="">No reconstructed outputs found</option>';
    } else {
      data.sources.forEach((src, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = src.source_file;
        opt.dataset.sourceIdx = i;
        selectSource.appendChild(opt);
      });
      selectSource.disabled = false;
      document.getElementById('btn-start').disabled = false;

      // Auto-start from URL params, or fall back to default
      const params = new URLSearchParams(location.search);
      const paramSource = params.get('source') || 'star_wars_iv.mp4';
      const paramStrategy = params.get('strategy') || 'runpod-wan+runpod-mmaudio';
      if (data.sources.length === 1) {
        startFromSource(data.sources[0], paramStrategy);
      } else {
        const match = data.sources.find(s => s.source_file === paramSource);
        if (match) startFromSource(match, paramStrategy);
      }
    }
  })
  .catch(() => {
    selectSource.innerHTML = '<option value="">Failed to scan — is serve.py running?</option>';
  });

function startFromSource(source, preferStrategy) {
  currentStrategies = source.strategies;
  strategySelect.innerHTML = '';
  if (source.strategies.length > 0) {
    source.strategies.forEach(s => {
      const o = document.createElement('option');
      o.value = s.path;
      o.textContent = s.label;
      o.dataset.strategyName = s.name;
      o.dataset.outputPath = s.output_path;
      o.dataset.hasSpeech = s.has_speech || false;
      strategySelect.appendChild(o);
    });
    if (preferStrategy) {
      for (const o of strategySelect.options) {
        if (o.dataset.strategyName === preferStrategy) {
          o.selected = true;
          break;
        }
      }
    }
    strategySelect.style.display = '';
  } else {
    strategySelect.style.display = 'none';
  }

  setupOverlay.classList.add('hidden');
  const first = source.strategies[0];
  const reconPath = strategySelect.value || first?.path;
  const outputPath = strategySelect.selectedOptions[0]?.dataset.outputPath || first?.output_path;
  if (reconPath) init(source.source_path, reconPath, outputPath);
}

document.getElementById('btn-start').addEventListener('click', () => {
  const idx = parseInt(selectSource.value);
  if (isNaN(idx) || !scanData) return;
  startFromSource(scanData.sources[idx], null);
});

// Strategy switch — reload with new strategy's clips and progress
strategySelect.addEventListener('change', () => {
  const wasPlaying = !vidOrig.paused;
  if (wasPlaying) pauseBoth();
  const origTime = vidOrig.currentTime;

  // Clear existing timeline
  timeline.querySelectorAll('.timeline-shot').forEach(el => el.remove());

  // Get output path from selected strategy (may differ across output runs)
  const selectedOpt = strategySelect.selectedOptions[0];
  const newOutputBase = selectedOpt?.dataset.outputPath || outputBase;

  // Re-init with the new strategy (reloads progress + rebuilds timeline)
  init(currentOrigSrc, strategySelect.value, newOutputBase);
});

// -- file:// toggle --
useFileUrls.addEventListener('change', () => {
  if (!currentOrigSrc || !outputBase) return;
  const wasPlaying = !vidOrig.paused;
  if (wasPlaying) pauseBoth();
  timeline.querySelectorAll('.timeline-shot').forEach(el => el.remove());
  init(currentOrigSrc, strategySelect.value, outputBase);
});

// -- Timeline click --
timeline.addEventListener('click', (e) => {
  const rect = timeline.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const time = pct * vidOrig.duration;
  seekBoth(time, findShot(time));
});

// -- Click video to play/pause --
document.querySelector('.video-pair').addEventListener('click', togglePlay);

// -- Control buttons --
btnPlay.addEventListener('click', togglePlay);
btnPrev.addEventListener('click', () => jumpToShot(activeShot - 1));
btnNext.addEventListener('click', () => jumpToShot(activeShot + 1));
btnSolo.addEventListener('click', () => {
  loopShot = !loopShot;
  btnSolo.classList.toggle('active', loopShot);
  if (loopShot && activeShot >= 0) {
    seekBoth(scenes[activeShot].start_s);
    playBoth();
  }
});
btnAudio.addEventListener('click', cycleAudioSource);

// -- View mode tabs --
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelector('.view-tab.active').classList.remove('active');
    tab.classList.add('active');
    viewMode = tab.dataset.view;
    promptPanel.classList.toggle('visible', viewMode === 'prompt');
    buildShotList();
    // Restore active highlight
    const el = document.getElementById(`shot-${activeShot}`);
    if (el) el.classList.add('active');
  });
});

// -- Keyboard shortcuts --
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  switch (e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      jumpToShot(activeShot - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      jumpToShot(activeShot + 1);
      break;
    case '[': {
      const newT = Math.max(0, vidOrig.currentTime - 1);
      seekBoth(newT, findShot(newT));
      break;
    }
    case ']': {
      const newTime = vidOrig.currentTime + 1;
      seekBoth(newTime, findShot(newTime));
      break;
    }
    case 'l':
    case 'L':
      btnSolo.click();
      break;
    case 'm':
    case 'M':
      cycleAudioSource();
      break;
  }
});
</script>
</body>
</html>
