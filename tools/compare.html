<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lossy — compare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #ddd; font-family: monospace; font-size: 13px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    grid-template-rows: 1fr auto auto;
    height: 100vh;
    gap: 0;
  }

  /* Dual/triple video area */
  .video-area {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    background: #000;
    min-height: 0;
  }
  .video-pair {
    flex: 1;
    display: flex;
    gap: 2px;
    min-height: 0;
    background: #000;
  }
  .video-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    position: relative;
  }
  .video-pane video {
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: contain;
    background: #000;
    cursor: pointer;
  }
  .pane-label {
    position: absolute;
    top: 8px;
    left: 10px;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 11px;
    z-index: 5;
    pointer-events: none;
  }
  .pane-label.original { color: #4af; }
  .pane-label.recon-a  { color: #f84; }
  .pane-label.recon-b  { color: #4f8; }
  .divider {
    width: 2px;
    background: #333;
    align-self: stretch;
    flex-shrink: 0;
  }

  /* Controls bar */
  .controls {
    grid-column: 1;
    grid-row: 2;
    padding: 8px 12px;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    gap: 12px;
    border-top: 1px solid #333;
    flex-wrap: wrap;
  }
  .controls button {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-family: monospace;
    font-size: 12px;
  }
  .controls button:hover { background: #444; }
  .controls button:active { background: #555; }
  .controls button.active { background: #553300; border-color: #fb0; color: #fb0; }
  .controls .spacer { flex: 1; }
  .shot-info-bar { color: #fb0; }
  .sync-indicator { color: #888; font-size: 11px; }
  .sync-indicator.warn { color: #f44; }

  .strategy-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .strategy-group label {
    font-size: 11px;
    color: #888;
    white-space: nowrap;
  }
  .strategy-group label.recon-a { color: #f84; }
  .strategy-group label.recon-b { color: #4f8; }
  .strategy-group select {
    background: #333;
    color: #ddd;
    border: 1px solid #555;
    padding: 3px 6px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 12px;
    max-width: 160px;
  }
  .strategy-group select:focus { outline: none; border-color: #888; }

  /* Timeline */
  .timeline-container {
    grid-column: 1;
    grid-row: 3;
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 1px solid #333;
  }
  .timeline {
    position: relative;
    height: 32px;
    background: #222;
    border-radius: 3px;
    cursor: pointer;
    overflow: hidden;
  }
  .timeline-shot {
    position: absolute;
    top: 0;
    height: 100%;
    border-right: 1px solid rgba(255, 180, 0, 0.6);
    transition: background 0.1s;
  }
  .timeline-shot:hover { background: rgba(255, 180, 0, 0.15); }
  .timeline-shot.active { background: rgba(255, 180, 0, 0.25); }
  .timeline-shot.not-decoded { opacity: 0.25; }
  .timeline-playhead {
    position: absolute;
    top: 0;
    width: 2px;
    height: 100%;
    background: #fff;
    pointer-events: none;
    z-index: 10;
  }
  .time-label {
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #888;
  }

  /* Sidebar */
  .sidebar {
    grid-column: 2;
    grid-row: 1 / 4;
    border-left: 1px solid #333;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-header {
    padding: 10px 12px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    font-size: 14px;
    font-weight: bold;
    color: #fb0;
    display: flex;
    justify-content: space-between;
  }

  /* View mode tabs */
  .view-tabs {
    display: flex;
    border-bottom: 1px solid #333;
    background: #1a1a1a;
  }
  .view-tab {
    flex: 1;
    padding: 6px 8px;
    text-align: center;
    cursor: pointer;
    font-size: 11px;
    color: #888;
    border-bottom: 2px solid transparent;
  }
  .view-tab:hover { color: #ddd; }
  .view-tab.active { color: #fb0; border-bottom-color: #fb0; }

  .shot-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .shot-item {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 8px;
    padding: 5px 8px;
    cursor: pointer;
    border-bottom: 1px solid #222;
    align-items: center;
  }
  .shot-item.two-col {
    grid-template-columns: 80px 1fr;
  }
  .shot-item:hover { background: #1a1a1a; }
  .shot-item.active { background: #2a2200; border-left: 3px solid #fb0; }
  .shot-item.not-decoded { opacity: 0.4; }
  .shot-item img {
    width: 100%;
    height: 26px;
    object-fit: cover;
    border-radius: 2px;
    background: #222;
  }
  .shot-item img.placeholder {
    background: #2a1a00;
    border: 1px dashed #553300;
  }
  .shot-meta { font-size: 10px; line-height: 1.4; }
  .shot-meta .shot-num { color: #fb0; }
  .shot-meta .shot-time { color: #888; }
  .shot-meta .shot-dur { color: #aaa; }

  /* Prompt panel */
  .prompt-panel {
    border-top: 1px solid #333;
    background: #1a1a1a;
    max-height: 200px;
    overflow-y: auto;
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.5;
    color: #aaa;
    display: none;
  }
  .prompt-panel.visible { display: block; }
  .prompt-panel .prompt-label { color: #fb0; font-weight: bold; margin-bottom: 4px; }
  .prompt-panel .prompt-text { color: #ddd; }

  .help {
    padding: 8px 12px;
    background: #1a1a1a;
    border-top: 1px solid #333;
    font-size: 10px;
    color: #666;
    line-height: 1.6;
  }

  /* Setup overlay */
  .setup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .setup-overlay.hidden { display: none; }
  .setup-box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 32px;
    max-width: 560px;
    width: 100%;
  }
  .setup-box h2 { color: #fb0; margin-bottom: 16px; }
  .setup-box p { margin-bottom: 12px; line-height: 1.5; color: #aaa; }
  .setup-box code {
    background: #222;
    padding: 2px 6px;
    border-radius: 3px;
    color: #ddd;
  }
  .setup-box .field { margin-bottom: 16px; }
  .setup-box label { display: block; margin-bottom: 4px; color: #888; font-size: 12px; }
  .setup-box select, .setup-box input {
    width: 100%;
    background: #222;
    border: 1px solid #444;
    color: #ddd;
    padding: 8px;
    border-radius: 3px;
    font-family: monospace;
    font-size: 13px;
    appearance: auto;
  }
  .setup-box select option { background: #222; color: #ddd; }
  .setup-box button {
    background: #fb0;
    color: #111;
    border: none;
    padding: 8px 24px;
    border-radius: 3px;
    cursor: pointer;
    font-family: monospace;
    font-size: 13px;
    font-weight: bold;
  }
  .setup-box button:hover { background: #fc3; }
  .setup-box button:disabled { background: #555; color: #888; cursor: default; }
  .setup-box .error { color: #f44; font-size: 12px; margin-top: 8px; display: none; }
  .setup-box .hint { color: #666; font-size: 11px; margin-top: 4px; }
  .setup-box .no-recon { color: #f84; font-size: 11px; }
</style>
</head>
<body>

<!-- Setup overlay -->
<div class="setup-overlay" id="setup-overlay">
  <div class="setup-box">
    <h2>lossy comparator</h2>
    <p>Start with: <code>python tools/serve.py</code></p>
    <div class="field">
      <label>Source film</label>
      <select id="input-source" disabled>
        <option value="">Scanning...</option>
      </select>
    </div>
    <button id="btn-start" disabled>Start</button>
    <div class="error" id="setup-error"></div>
  </div>
</div>

<div class="layout">
  <div class="video-area">
    <div class="video-pair">
      <div class="video-pane">
        <span class="pane-label original">ORIGINAL</span>
        <video id="vid-original" preload="metadata" muted></video>
      </div>
      <div class="divider"></div>
      <div class="video-pane">
        <span class="pane-label recon-a" id="label-a">A</span>
        <video id="vid-recon-a" preload="metadata"></video>
      </div>
      <div class="divider"></div>
      <div class="video-pane">
        <span class="pane-label recon-b" id="label-b">B</span>
        <video id="vid-recon-b" preload="metadata" muted></video>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-prev" title="Previous shot">&#8592; Prev</button>
    <button id="btn-play" title="Play/pause">Play</button>
    <button id="btn-next" title="Next shot">Next &#8594;</button>
    <button id="btn-solo" title="Toggle single-shot loop">Loop shot</button>
    <button id="btn-audio" title="Cycle audio source (M)">Audio: generated</button>
    <audio id="speech-audio" preload="auto"></audio>
    <input id="volume-slider" type="range" min="0" max="100" value="70" title="Volume" style="width:60px;vertical-align:middle;accent-color:#fb0;cursor:pointer">
    <span class="spacer"></span>
    <div class="strategy-group" id="strategy-group-a" style="display:none">
      <label class="recon-a">A:</label>
      <select id="strategy-select-a"></select>
    </div>
    <div class="strategy-group" id="strategy-group-b" style="display:none">
      <label class="recon-b">B:</label>
      <select id="strategy-select-b"></select>
    </div>
    <label style="font-size:11px;color:#888;cursor:pointer;margin-left:8px" title="Serve videos directly from disk (avoids HTTP buffering issues with large files)"><input type="checkbox" id="use-file-urls" style="vertical-align:middle;accent-color:#fb0;cursor:pointer"> file://</label>
    <span class="sync-indicator" id="sync-info"></span>
    <span class="shot-info-bar" id="shot-info">Loading...</span>
  </div>

  <div class="timeline-container">
    <div class="timeline" id="timeline">
      <div class="timeline-playhead" id="playhead"></div>
    </div>
    <div class="time-label">
      <span id="time-current">00:00:00</span>
      <span id="time-total">--:--:--</span>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span>Shots</span>
      <span id="shot-count">&mdash;</span>
    </div>
    <div class="view-tabs">
      <div class="view-tab active" data-view="paired">Paired</div>
      <div class="view-tab" data-view="prompt">With prompt</div>
    </div>
    <div class="shot-list" id="shot-list"></div>
    <div class="prompt-panel" id="prompt-panel">
      <div class="prompt-label">Prompt</div>
      <div class="prompt-text" id="prompt-text"></div>
    </div>
    <div class="help">
      <b>Keys:</b> Space=play/pause, &#8592;/&#8594;=prev/next shot,
      [/]=step &plusmn;1s, L=loop shot, M=cycle audio source
    </div>
  </div>
</div>

<script>
const vidOrig        = document.getElementById('vid-original');
const vidReconA      = document.getElementById('vid-recon-a');
const vidReconB      = document.getElementById('vid-recon-b');
const labelA         = document.getElementById('label-a');
const labelB         = document.getElementById('label-b');
const timeline       = document.getElementById('timeline');
const playhead       = document.getElementById('playhead');
const shotList       = document.getElementById('shot-list');
const shotInfo       = document.getElementById('shot-info');
const shotCount      = document.getElementById('shot-count');
const syncInfo       = document.getElementById('sync-info');
const timeCurrent    = document.getElementById('time-current');
const timeTotal      = document.getElementById('time-total');
const btnPlay        = document.getElementById('btn-play');
const btnPrev        = document.getElementById('btn-prev');
const btnNext        = document.getElementById('btn-next');
const btnSolo        = document.getElementById('btn-solo');
const promptPanel    = document.getElementById('prompt-panel');
const promptText     = document.getElementById('prompt-text');
const setupOverlay   = document.getElementById('setup-overlay');
const setupError     = document.getElementById('setup-error');
const strategySelectA = document.getElementById('strategy-select-a');
const strategySelectB = document.getElementById('strategy-select-b');
const strategyGroupA = document.getElementById('strategy-group-a');
const strategyGroupB = document.getElementById('strategy-group-b');

let scenes = [];
let prompts = [];
let activeShot = -1;
let loopShot = false;
let viewMode = 'paired';
let isSeeking = false;
let lastSyncedShot = -1;

// Audio source: 'generated', 'generated+speech', 'original', 'off'
let audioSource = 'generated';
let hasSpeech = false;
const btnAudio    = document.getElementById('btn-audio');
const speechAudio = document.getElementById('speech-audio');

// -- Pane state --
// Each recon pane tracks its own clip state independently.
function makePaneState(vid) {
  return {
    vid,
    clipMap: {},
    decodedShots: new Set(),
    clipsBasePath: '',
    currentClipShotIdx: -1,
    currentSubClipIdx: 0,
    pendingLoad: null,
    clipErrorHandler: null,
  };
}
const paneA = makePaneState(vidReconA);
const paneB = makePaneState(vidReconB);

// -- Audio --
function setAudioSource(src) {
  audioSource = src;
  if (src === 'generated') {
    vidOrig.muted = true;
    vidReconA.muted = false;
    vidReconB.muted = true;
    speechAudio.muted = true;
    btnAudio.textContent = 'Audio: generated';
    btnAudio.classList.remove('active');
  } else if (src === 'generated+speech') {
    vidOrig.muted = true;
    vidReconA.muted = false;
    vidReconB.muted = true;
    speechAudio.muted = false;
    btnAudio.textContent = 'Audio: gen+speech';
    btnAudio.classList.add('active');
  } else if (src === 'original') {
    vidOrig.muted = false;
    vidReconA.muted = true;
    vidReconB.muted = true;
    speechAudio.muted = true;
    btnAudio.textContent = 'Audio: original';
    btnAudio.classList.add('active');
  } else {
    vidOrig.muted = true;
    vidReconA.muted = true;
    vidReconB.muted = true;
    speechAudio.muted = true;
    btnAudio.textContent = 'Audio: off';
    btnAudio.classList.remove('active');
  }
}

function cycleAudioSource() {
  if (audioSource === 'generated') {
    if (hasSpeech) setAudioSource('generated+speech');
    else setAudioSource('original');
  } else if (audioSource === 'generated+speech') setAudioSource('original');
  else if (audioSource === 'original') setAudioSource('off');
  else setAudioSource('generated');
}

// Volume
const volumeSlider = document.getElementById('volume-slider');
vidOrig.volume = vidReconA.volume = vidReconB.volume = speechAudio.volume = 0.7;
volumeSlider.addEventListener('input', () => {
  const v = volumeSlider.value / 100;
  vidOrig.volume = vidReconA.volume = vidReconB.volume = speechAudio.volume = v;
});

// -- Formatting --
function fmt(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// -- Shot lookup --
function findShot(time) {
  let lo = 0, hi = scenes.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (time < scenes[mid].start_s) hi = mid - 1;
    else if (time >= scenes[mid].end_s) lo = mid + 1;
    else return mid;
  }
  return Math.max(0, Math.min(lo, scenes.length - 1));
}

// -- Build clip map for a pane from decode progress --
function buildClipMap(pane, progress, basePath) {
  pane.clipMap = {};
  pane.decodedShots = new Set();
  pane.clipsBasePath = basePath;

  if (!progress) return;

  const clipsMeta = progress.clips || {};
  const completed = progress.completed || [];

  for (const idx of completed) {
    const idxStr = String(idx);
    if (clipsMeta[idxStr]) {
      const clips = clipsMeta[idxStr].map(c => ({
        src: `${basePath}/${c.path}`,
        duration: c.duration_s
      }));
      pane.clipMap[idx] = {
        clips,
        totalDuration: clips.reduce((sum, c) => sum + c.duration, 0)
      };
    } else {
      const dur = scenes[idx] ? scenes[idx].duration_s : 5;
      pane.clipMap[idx] = {
        clips: [{ src: `${basePath}/${String(idx).padStart(4, '0')}.mp4`, duration: dur }],
        totalDuration: dur
      };
    }
    pane.decodedShots.add(idx);
  }
}

// Sub-clip resolution for split shots
function resolveSubClip(mapping, offsetInShot) {
  let cumulative = 0;
  for (let i = 0; i < mapping.clips.length; i++) {
    const clipDur = mapping.clips[i].duration;
    if (offsetInShot < cumulative + clipDur || i === mapping.clips.length - 1) {
      return { subIdx: i, posInClip: Math.max(0, offsetInShot - cumulative) };
    }
    cumulative += clipDur;
  }
  return { subIdx: 0, posInClip: 0 };
}

// -- Clip loading for a pane --
function safePlay(el) {
  const p = el.play();
  if (p && p.catch) p.catch(() => {});
}

function loadClip(pane, shotIdx, subIdx, seekTo) {
  const mapping = pane.clipMap[shotIdx];
  if (!mapping) return;
  const clip = mapping.clips[subIdx];

  let src = clip.src;
  if (useFileUrls.checked && projectRoot) {
    src = toFileUrl(src);
  }

  // Already loaded — just seek
  if (pane.currentClipShotIdx === shotIdx && pane.currentSubClipIdx === subIdx && pane.vid.readyState >= 2) {
    pane.vid.currentTime = Math.max(0, seekTo);
    if (!vidOrig.paused && pane.vid.paused) safePlay(pane.vid);
    return;
  }

  pane.currentClipShotIdx = shotIdx;
  pane.currentSubClipIdx = subIdx;

  if (pane.pendingLoad) {
    pane.vid.removeEventListener('canplay', pane.pendingLoad);
    pane.pendingLoad = null;
  }
  if (pane.clipErrorHandler) {
    pane.vid.removeEventListener('error', pane.clipErrorHandler);
    pane.clipErrorHandler = null;
  }

  pane.vid.src = src;

  pane.pendingLoad = function onReady() {
    pane.vid.removeEventListener('canplay', onReady);
    pane.vid.removeEventListener('error', pane.clipErrorHandler);
    pane.pendingLoad = null;
    pane.clipErrorHandler = null;
    pane.vid.currentTime = Math.max(0, seekTo);
    if (!vidOrig.paused) safePlay(pane.vid);
  };

  pane.clipErrorHandler = function onError() {
    pane.vid.removeEventListener('canplay', pane.pendingLoad);
    pane.vid.removeEventListener('error', onError);
    pane.pendingLoad = null;
    pane.clipErrorHandler = null;
    console.warn(`[lossy] failed to load clip: ${src}`);
  };

  pane.vid.addEventListener('canplay', pane.pendingLoad);
  pane.vid.addEventListener('error', pane.clipErrorHandler);
  pane.vid.load();
}

// Sub-clip advancement on 'ended'
function advanceSubClip(pane) {
  if (pane.currentClipShotIdx < 0) return;
  const mapping = pane.clipMap[pane.currentClipShotIdx];
  if (!mapping) return;
  if (pane.currentSubClipIdx + 1 < mapping.clips.length) {
    loadClip(pane, pane.currentClipShotIdx, pane.currentSubClipIdx + 1, 0);
  }
}
vidReconA.addEventListener('ended', () => advanceSubClip(paneA));
vidReconB.addEventListener('ended', () => advanceSubClip(paneB));

// -- Sync engine --
function syncPaneToOrig(pane) {
  if (isSeeking) return;
  const t = vidOrig.currentTime;
  const idx = findShot(t);
  const mapping = pane.clipMap[idx];

  if (!mapping) {
    if (!pane.vid.paused) pane.vid.pause();
    return;
  }

  if (idx !== pane.currentClipShotIdx) {
    const offsetInShot = t - scenes[idx].start_s;
    const { subIdx, posInClip } = resolveSubClip(mapping, offsetInShot);
    loadClip(pane, idx, subIdx, posInClip);
    return;
  }

  if (pane.vid.readyState >= 2) {
    if (!vidOrig.paused && pane.vid.paused) {
      if (pane.vid.ended) pane.vid.currentTime = 0;
      safePlay(pane.vid);
    }
  }
}

function syncReconToOrig() {
  if (isSeeking) return;
  const idx = findShot(vidOrig.currentTime);
  const hasA = !!paneA.clipMap[idx];
  const hasB = !!paneB.clipMap[idx];

  if (!hasA && !hasB) {
    syncInfo.textContent = 'not decoded';
    syncInfo.className = 'sync-indicator warn';
  } else if (!hasA || !hasB) {
    syncInfo.textContent = !hasA ? 'A: not decoded' : 'B: not decoded';
    syncInfo.className = 'sync-indicator warn';
  } else {
    syncInfo.textContent = '';
    syncInfo.className = 'sync-indicator';
  }
  lastSyncedShot = idx;

  syncPaneToOrig(paneA);
  syncPaneToOrig(paneB);
}

// -- Playback controls --
function seekBoth(origTime, shotIdx) {
  isSeeking = true;
  vidOrig.currentTime = origTime;
  if (hasSpeech) speechAudio.currentTime = origTime;
  const idx = shotIdx !== undefined ? shotIdx : findShot(origTime);
  for (const pane of [paneA, paneB]) {
    const mapping = pane.clipMap[idx];
    if (mapping) {
      const offsetInShot = origTime - scenes[idx].start_s;
      const { subIdx, posInClip } = resolveSubClip(mapping, offsetInShot);
      loadClip(pane, idx, subIdx, Math.max(0, posInClip));
    }
  }
  lastSyncedShot = idx;
  setTimeout(() => { isSeeking = false; }, 250);
}

function playBoth() {
  safePlay(vidOrig);
  const shotIdx = findShot(vidOrig.currentTime);
  for (const pane of [paneA, paneB]) {
    if (pane.clipMap[shotIdx] && pane.vid.readyState >= 2) safePlay(pane.vid);
  }
  if (hasSpeech) safePlay(speechAudio);
  btnPlay.textContent = 'Pause';
}

function pauseBoth() {
  vidOrig.pause();
  vidReconA.pause();
  vidReconB.pause();
  if (hasSpeech) speechAudio.pause();
  btnPlay.textContent = 'Play';
}

function togglePlay() {
  if (vidOrig.paused) playBoth();
  else pauseBoth();
}

// -- Active shot management --
function setActiveShot(idx) {
  if (idx === activeShot) return;
  const prev = document.querySelector('.shot-item.active');
  if (prev) prev.classList.remove('active');
  const prevTl = document.querySelector('.timeline-shot.active');
  if (prevTl) prevTl.classList.remove('active');

  activeShot = idx;
  const el = document.getElementById(`shot-${idx}`);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({ block: 'nearest' });
  }
  const tlEl = document.getElementById(`tl-${idx}`);
  if (tlEl) tlEl.classList.add('active');

  const s = scenes[idx];
  const decodedA = paneA.decodedShots.has(idx);
  const decodedB = paneB.decodedShots.has(idx);
  const tag = (!decodedA && !decodedB) ? '  [not decoded]'
            : (!decodedA) ? '  [A: not decoded]'
            : (!decodedB) ? '  [B: not decoded]'
            : '';
  shotInfo.textContent = `Shot ${idx + 1}/${scenes.length}  |  ${s.start_timecode} \u2192 ${s.end_timecode}  |  ${s.duration_s.toFixed(2)}s${tag}`;

  if (prompts.length > idx) {
    const p = prompts[idx];
    promptText.textContent = p.formatted_prompt || p.prompt || '(no prompt)';
  } else {
    promptText.textContent = '(no prompt data)';
  }
}

function jumpToShot(idx) {
  if (idx < 0 || idx >= scenes.length) return;
  seekBoth(scenes[idx].start_s, idx);
  setActiveShot(idx);
}

// -- Shot looping --
function checkShotLoop() {
  if (!loopShot || activeShot < 0) return;
  const s = scenes[activeShot];
  if (vidOrig.currentTime >= s.end_s) {
    seekBoth(s.start_s, activeShot);
  }
}

// -- Build UI --
function buildTimeline() {
  timeline.querySelectorAll('.timeline-shot').forEach(el => el.remove());
  const duration = scenes[scenes.length - 1].end_s;
  const allDecoded = new Set([...paneA.decodedShots, ...paneB.decodedShots]);
  scenes.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'timeline-shot';
    if (!allDecoded.has(i)) el.classList.add('not-decoded');
    el.id = `tl-${i}`;
    el.style.left = `${(s.start_s / duration) * 100}%`;
    el.style.width = `${((s.end_s - s.start_s) / duration) * 100}%`;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      jumpToShot(i);
    });
    timeline.appendChild(el);
  });
}

function buildShotList() {
  shotList.innerHTML = '';
  const allDecoded = new Set([...paneA.decodedShots, ...paneB.decodedShots]);
  scenes.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = viewMode === 'prompt' ? 'shot-item two-col' : 'shot-item';
    if (!allDecoded.has(i)) el.classList.add('not-decoded');
    el.id = `shot-${i}`;

    if (viewMode === 'paired') {
      el.innerHTML = `
        <img src="${outputBase}/keyframes/${s.keyframes[0]}" loading="lazy" alt="Shot ${i+1}">
        <div class="shot-meta">
          <div><span class="shot-num">#${i+1}</span> <span class="shot-dur">${s.duration_s.toFixed(1)}s</span></div>
          <div class="shot-time">${s.start_timecode}</div>
        </div>
      `;
    } else {
      const promptExcerpt = prompts[i]
        ? (prompts[i].formatted_prompt || prompts[i].prompt || '').slice(0, 80) + '...'
        : '';
      el.innerHTML = `
        <img src="${outputBase}/keyframes/${s.keyframes[0]}" loading="lazy" alt="Shot ${i+1}">
        <div class="shot-meta">
          <div><span class="shot-num">#${i+1}</span> <span class="shot-dur">${s.duration_s.toFixed(1)}s</span></div>
          <div class="shot-time" style="color:#aaa">${promptExcerpt}</div>
        </div>
      `;
    }
    el.addEventListener('click', () => jumpToShot(i));
    shotList.appendChild(el);
  });
}

let outputBase = '';
let currentOrigSrc = '';

function toFileUrl(httpPath) {
  const rel = httpPath.replace(/^\//, '');
  return 'file://' + projectRoot + '/' + rel;
}

// -- Per-pane initialization (load progress + build clip map) --
async function initPane(pane, selectEl, labelEl) {
  const opt = selectEl.selectedOptions[0];
  if (!opt || !opt.value) {
    // (off) — clear the pane
    pane.clipMap = {};
    pane.decodedShots = new Set();
    pane.currentClipShotIdx = -1;
    pane.vid.removeAttribute('src');
    const id = labelEl.id === 'label-a' ? 'A' : 'B';
    labelEl.textContent = id;
    return;
  }

  const strategyName = opt.dataset.strategyName || null;
  const paneOutputBase = opt.dataset.outputPath || outputBase;
  const videoStrategy = strategyName && strategyName.includes('+')
    ? strategyName.split('+')[0]
    : strategyName;

  // Update pane label
  if (labelEl) {
    const id = labelEl.id === 'label-a' ? 'A' : 'B';
    labelEl.textContent = strategyName ? `${id}: ${strategyName}` : id;
  }

  const progressUrls = [];
  if (strategyName && strategyName !== 'default') {
    progressUrls.push(`${paneOutputBase}/decode_progress_${strategyName}.json`);
    if (strategyName.includes('+')) {
      progressUrls.push(`${paneOutputBase}/decode_progress_${videoStrategy}.json`);
    }
  }
  progressUrls.push(`${paneOutputBase}/decode_progress.json`);

  let progress = null;
  for (const url of progressUrls) {
    try {
      const r = await fetch(url);
      if (r.ok) { progress = await r.json(); break; }
    } catch {}
  }

  const adjBase = `${paneOutputBase}/adjusted/${videoStrategy}`;
  buildClipMap(pane, progress, adjBase);
}

// -- Full init (called once per source, re-called on file:// toggle) --
function init(originalSrc, base) {
  outputBase = base;
  currentOrigSrc = originalSrc;

  if (useFileUrls.checked && projectRoot) {
    vidOrig.src = toFileUrl(originalSrc);
  } else {
    vidOrig.src = originalSrc;
  }

  // Reset both panes
  for (const pane of [paneA, paneB]) {
    pane.currentClipShotIdx = -1;
    pane.currentSubClipIdx = 0;
  }
  lastSyncedShot = -1;

  // Check for speech track
  fetch(`${base}/speech_track.wav`, {method: 'HEAD'}).then(r => {
    if (r.ok) {
      hasSpeech = true;
      speechAudio.src = `${base}/speech_track.wav`;
      speechAudio.muted = true;
    } else {
      hasSpeech = false;
      speechAudio.src = '';
    }
  }).catch(() => { hasSpeech = false; });

  Promise.all([
    fetch(`${base}/manifest.json`).then(r => r.json()),
    fetch(`${base}/prompts.json`).then(r => r.json()).catch(() => []),
    initPane(paneA, strategySelectA, labelA),
    initPane(paneB, strategySelectB, labelB),
  ]).then(([manifest, promptData]) => {
    scenes = manifest.scenes;
    prompts = promptData;

    const decodedCount = new Set([...paneA.decodedShots, ...paneB.decodedShots]).size;
    shotCount.textContent = `${decodedCount}/${scenes.length}`;

    buildTimeline();
    buildShotList();

    const sorted = [...new Set([...paneA.decodedShots, ...paneB.decodedShots])].sort((a, b) => a - b);
    const firstDecoded = sorted[0] || 0;
    setActiveShot(firstDecoded);
    seekBoth(scenes[firstDecoded].start_s, firstDecoded);
  });
}

// Attach vidOrig events once
vidOrig.addEventListener('timeupdate', () => {
  const t = vidOrig.currentTime;
  const dur = vidOrig.duration || 1;
  playhead.style.left = `${(t / dur) * 100}%`;
  timeCurrent.textContent = fmt(t);

  const idx = findShot(t);
  setActiveShot(idx);

  syncReconToOrig();
  checkShotLoop();
});

vidOrig.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmt(vidOrig.duration);
});
vidOrig.addEventListener('play',  () => btnPlay.textContent = 'Pause');
vidOrig.addEventListener('pause', () => btnPlay.textContent = 'Play');

// -- Scan API + setup form --
const selectSource = document.getElementById('input-source');
const useFileUrls = document.getElementById('use-file-urls');
let scanData = null;
let projectRoot = '';
let currentStrategies = [];

fetch('/api/scan')
  .then(r => r.json())
  .then(data => {
    scanData = data;
    projectRoot = data.project_root || '';

    selectSource.innerHTML = '';
    if (data.sources.length === 0) {
      selectSource.innerHTML = '<option value="">No reconstructed outputs found</option>';
    } else {
      data.sources.forEach((src, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = src.source_file;
        selectSource.appendChild(opt);
      });
      selectSource.disabled = false;
      document.getElementById('btn-start').disabled = false;

      const params = new URLSearchParams(location.search);
      const paramSource = params.get('source') || 'star_wars_iv.mp4';
      const paramA = params.get('a') || params.get('strategy') || null;
      const paramB = params.get('b') || null;
      if (data.sources.length === 1) {
        startFromSource(data.sources[0], paramA, paramB);
      } else {
        const match = data.sources.find(s => s.source_file === paramSource);
        if (match) startFromSource(match, paramA, paramB);
      }
    }
  })
  .catch(() => {
    selectSource.innerHTML = '<option value="">Failed to scan — is serve.py running?</option>';
  });

function populateStrategySelect(selectEl, strategies, preferName) {
  // Add an "(off)" option first
  selectEl.innerHTML = '<option value="" data-strategy-name="" data-output-path="">(off)</option>';
  strategies.forEach(s => {
    const o = document.createElement('option');
    o.value = s.path;
    o.textContent = s.label;
    o.dataset.strategyName = s.name;
    o.dataset.outputPath = s.output_path || outputBase;
    selectEl.appendChild(o);
  });
  if (preferName) {
    for (const o of selectEl.options) {
      if (o.dataset.strategyName === preferName) {
        o.selected = true;
        return;
      }
    }
  }
}

function startFromSource(source, preferA, preferB) {
  currentStrategies = source.strategies;

  if (source.strategies.length > 0) {
    // Default A to first strategy, B to second (if available)
    const defaultA = preferA || source.strategies[0]?.name || null;
    const defaultB = preferB || source.strategies[1]?.name || null;

    populateStrategySelect(strategySelectA, source.strategies, defaultA);
    populateStrategySelect(strategySelectB, source.strategies, defaultB);

    strategyGroupA.style.display = '';
    strategyGroupB.style.display = '';
  } else {
    strategyGroupA.style.display = 'none';
    strategyGroupB.style.display = 'none';
  }

  setupOverlay.classList.add('hidden');

  const firstStrategy = source.strategies[0];
  const base = strategySelectA.selectedOptions[0]?.dataset.outputPath
    || firstStrategy?.output_path
    || `/output/${source.source_file.replace(/\.[^.]+$/, '')}`;

  init(source.source_path, base);
}

document.getElementById('btn-start').addEventListener('click', () => {
  const idx = parseInt(selectSource.value);
  if (isNaN(idx) || !scanData) return;
  startFromSource(scanData.sources[idx], null, null);
});

// Strategy change handlers — reinit just that pane, rebuild UI
async function onStrategyChange(pane, selectEl, labelEl) {
  const wasPlaying = !vidOrig.paused;
  if (wasPlaying) pauseBoth();
  const origTime = vidOrig.currentTime;

  // If this is pane A and a new output base is selected, update outputBase
  const opt = selectEl.selectedOptions[0];
  if (pane === paneA && opt?.dataset.outputPath) {
    outputBase = opt.dataset.outputPath;
  }

  pane.currentClipShotIdx = -1;
  pane.currentSubClipIdx = 0;

  await initPane(pane, selectEl, labelEl);

  const decodedCount = new Set([...paneA.decodedShots, ...paneB.decodedShots]).size;
  shotCount.textContent = `${decodedCount}/${scenes.length}`;
  if (scenes.length) {
    buildTimeline();
    buildShotList();
    seekBoth(origTime, findShot(origTime));
    const el = document.getElementById(`shot-${activeShot}`);
    if (el) el.classList.add('active');
  }

  if (wasPlaying) playBoth();
}

strategySelectA.addEventListener('change', () => onStrategyChange(paneA, strategySelectA, labelA));
strategySelectB.addEventListener('change', () => onStrategyChange(paneB, strategySelectB, labelB));

// -- file:// toggle --
useFileUrls.addEventListener('change', () => {
  if (!currentOrigSrc) return;
  const wasPlaying = !vidOrig.paused;
  if (wasPlaying) pauseBoth();
  init(currentOrigSrc, outputBase);
});

// -- Timeline click --
timeline.addEventListener('click', (e) => {
  const rect = timeline.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const time = pct * vidOrig.duration;
  seekBoth(time, findShot(time));
});

// -- Click video area to play/pause --
document.querySelector('.video-pair').addEventListener('click', togglePlay);

// -- Control buttons --
btnPlay.addEventListener('click', togglePlay);
btnPrev.addEventListener('click', () => jumpToShot(activeShot - 1));
btnNext.addEventListener('click', () => jumpToShot(activeShot + 1));
btnSolo.addEventListener('click', () => {
  loopShot = !loopShot;
  btnSolo.classList.toggle('active', loopShot);
  if (loopShot && activeShot >= 0) {
    seekBoth(scenes[activeShot].start_s);
    playBoth();
  }
});
btnAudio.addEventListener('click', cycleAudioSource);

// -- View mode tabs --
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelector('.view-tab.active').classList.remove('active');
    tab.classList.add('active');
    viewMode = tab.dataset.view;
    promptPanel.classList.toggle('visible', viewMode === 'prompt');
    buildShotList();
    const el = document.getElementById(`shot-${activeShot}`);
    if (el) el.classList.add('active');
  });
});

// -- Keyboard shortcuts --
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      jumpToShot(activeShot - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      jumpToShot(activeShot + 1);
      break;
    case '[': {
      const newT = Math.max(0, vidOrig.currentTime - 1);
      seekBoth(newT, findShot(newT));
      break;
    }
    case ']': {
      const newTime = vidOrig.currentTime + 1;
      seekBoth(newTime, findShot(newTime));
      break;
    }
    case 'l':
    case 'L':
      btnSolo.click();
      break;
    case 'm':
    case 'M':
      cycleAudioSource();
      break;
  }
});
</script>
