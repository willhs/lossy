[project]
name = "lossy"
version = "0.1.0"
description = "Lossy film encoder/decoder"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "scenedetect",
    "tensorflow>=2.16",
    "tensorflow-hub>=0.16.1",
    "scipy",
    "google-genai",
    "replicate",
    "fal-client",
    "httpx",
    "runpod",
    "setuptools<81",
]

[tool.uv]
override-dependencies = ["tf-keras>=2.16"]

[dependency-groups]
dev = [
    "pytest",
    "spec-check @ git+https://github.com/willhs/spec-check.git@main",
]

[tool.pytest.ini_options]
markers = [
    "req(ids): Links test to spec requirement(s) e.g. @pytest.mark.req('SPEC-100/REQ-001')",
]

[tool.spec-check.check-coverage]
specs_dir = "docs/design"
tests_dir = "."
min_coverage = 90.0
use_gitignore = true

[tool.ruff]
line-length = 120

# These files embed long natural-language content (LLM system prompts, CJK
# negative-prompt strings, explanatory math comments) that reads worse
# hard-wrapped than left alone -- ignore line length there specifically
# rather than everywhere.
[tool.ruff.per-file-ignores]
"encode.py" = ["E501"]
"eval.py" = ["E501"]
"voice_casting.py" = ["E501"]
"strategies_video.py" = ["E501"]
"tests/test_decode.py" = ["E501"]
